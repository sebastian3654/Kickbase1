<style>
  :root{
    --bg:#000000;
    --card:#0A0A0C;
    --card-2:#131315;
    --border:#262629;
    --border-soft:#1C1C1F;
    --pill:#1C1C1F;
    --text:#FFFFFF;
    --muted:#9A9AA0;
    --muted-2:#6E6E73;
    --accent:#7ED957;
    --accent-text:#0A0A0C;
    --danger:#FF5A45;
    --warn-bg:#241512;
    --warn-text:#FFB59F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:radial-gradient(1100px 500px at 50% -10%, #141416 0%, #000000 60%);
    color:var(--text);
    font-family:'Inter',sans-serif;
  }
  input::placeholder, textarea::placeholder{color:var(--muted-2);}
  .wrap{max-width:640px;margin:0 auto;padding:28px 16px 60px;}
  h1{font-weight:800;letter-spacing:-0.02em;text-transform:uppercase;font-size:30px;margin:0;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .btn{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    border-radius:6px;padding:8px 12px;font-size:12px;cursor:pointer;font-family:inherit;
  }
  .btn:hover{border-color:#3a3a3f;}
  .btn-primary{
    background:var(--accent);color:var(--accent-text);border:none;
    border-radius:6px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;font-family:inherit;
  }
  .btn-primary:disabled{opacity:0.5;cursor:default;}
  .btn-ghost{background:transparent;border:none;color:var(--muted-2);cursor:pointer;font-family:inherit;}
  .field{
    background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);
    padding:10px 12px;font-size:14px;outline:none;font-family:inherit;width:100%;
  }
  .field:focus{border-color:#3a3a3f;}
  .num{font-variant-numeric:tabular-nums;}
  .muted{color:var(--muted);font-size:13px;}
  .muted-2{color:var(--muted-2);font-size:12px;}
  .card{background:var(--card-2);border:1px solid var(--border);border-radius:10px;padding:14px;}
  .hidden{display:none !important;}

  /* Login */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-box{width:100%;max-width:340px;text-align:center;}
  .login-box h1{margin-bottom:6px;}
  .login-box p{color:var(--muted);font-size:14px;margin:0 0 22px;}
  .login-box .field{margin-bottom:12px;text-align:center;font-size:16px;}
  .login-box .btn-primary{width:100%;justify-content:center;padding:12px;font-size:14px;}

  /* Scoreboard */
  .scoreboard{
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);
    border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#0A0A0C;margin:20px 0 24px;
  }
  .score{padding:16px 8px;text-align:center;min-width:0;}
  .score + .score{border-left:1px solid var(--border);}
  .score-label{font-size:11px;font-weight:600;letter-spacing:0.06em;color:var(--muted-2);margin-bottom:6px;}
  .score-value{font-weight:800;line-height:1.1;word-break:break-word;}

  /* Player rows */
  .player-row{
    display:grid;grid-template-columns:36px 1fr 56px auto 32px;align-items:center;gap:10px;
    padding:12px 4px;border-bottom:1px solid var(--border-soft);
  }
  .player-row:last-child{border-bottom:none;}
  .avatar{
    width:32px;height:32px;border-radius:50%;background:var(--pill);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);
  }
  .pname{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:-0.01em;}
  .ppos{
    font-size:10px;font-weight:700;color:var(--muted);background:var(--pill);border-radius:5px;
    padding:4px 6px;justify-self:start;letter-spacing:0.02em;
  }
  .pprice{font-size:14px;font-weight:700;text-align:right;}
  .row-remove{background:transparent;border:none;color:var(--muted-2);cursor:pointer;justify-self:end;padding:4px;font-size:16px;}

  .empty{
    text-align:center;padding:40px 20px;color:var(--muted-2);border:1px dashed var(--border);
    border-radius:10px;font-size:14px;
  }
  .add-form{
    background:var(--card-2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:20px;
    display:grid;grid-template-columns:1fr 76px 120px auto;gap:8px;align-items:center;
  }
  select.field{padding:10px 4px;}
  .warn{margin-bottom:20px;padding:10px 12px;border:1px solid #5a2e22;border-radius:8px;background:var(--warn-bg);color:var(--warn-text);font-size:13px;}
  .status-line{font-size:12px;margin:0 0 20px;color:var(--muted-2);}
  .status-error{color:var(--danger);}
  textarea.field{resize:vertical;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .link-btn{background:none;border:none;color:var(--muted-2);font-size:12px;text-decoration:underline;cursor:pointer;padding:0;font-family:inherit;}
  .market-row{
    display:grid;grid-template-columns:36px 1fr 56px auto;align-items:center;gap:10px;
    padding:12px 4px;border-bottom:1px solid var(--border-soft);
  }
  .market-row:last-child{border-bottom:none;}
  .market-expiry{font-size:10px;color:var(--muted-2);text-align:right;display:block;margin-top:2px;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>Kassenbuch</h1>
    <p>Gib deinen Namen ein. Dein Kader wird automatisch unter diesem Namen gespeichert.</p>
    <input id="login-name" class="field" placeholder="Dein Name" autocomplete="off" />
    <button id="login-btn" class="btn-primary" style="width:100%;justify-content:center;padding:12px;font-size:14px;">Weiter</button>

    <button id="kb-toggle" class="link-btn" style="display:block;margin:18px auto 0;">Stattdessen mit Kickbase-Konto verbinden (Beta)</button>

    <div id="kb-box" class="hidden" style="margin-top:14px;text-align:left;">
      <div class="muted-2" style="margin-bottom:10px;">
        Login geht direkt an Kickbase, nicht über mich. Inoffiziell — kann jederzeit kaputtgehen.
      </div>
      <input id="kb-email" class="field" placeholder="Kickbase E-Mail" autocomplete="off" style="margin-bottom:8px;" />
      <input id="kb-pass" type="password" class="field" placeholder="Kickbase Passwort" autocomplete="off" style="margin-bottom:8px;" />
      <button id="kb-login-btn" class="btn-primary" style="width:100%;justify-content:center;padding:12px;font-size:14px;">Verbinden</button>
    </div>

    <div id="kb-league-box" class="hidden" style="margin-top:14px;text-align:left;">
      <div class="muted-2" style="margin-bottom:10px;">Welche Liga?</div>
      <select id="kb-league-select" class="field" style="margin-bottom:8px;"></select>
      <button id="kb-league-btn" class="btn-primary" style="width:100%;justify-content:center;padding:12px;font-size:14px;">Kader laden</button>
    </div>

    <div id="kb-error" class="status-error hidden" style="margin-top:10px;font-size:13px;text-align:left;"></div>
  </div>
</div>

<div id="app-screen" class="wrap hidden">
  <div class="row" style="margin-bottom:6px;">
    <h1>Kassenbuch</h1>
    <div style="display:flex;gap:8px;">
      <button id="undo-btn" class="btn" disabled>↩ Zurück</button>
      <button id="logout-btn" class="btn">Abmelden</button>
      <button id="reset-btn" class="btn">Reset</button>
    </div>
  </div>
  <p class="muted" id="subtitle" style="margin:0 0 8px;"></p>
  <p class="status-line" id="status-line">&nbsp;</p>
  <div id="warn-box" class="warn hidden"></div>

  <div class="scoreboard">
    <div class="score"><div class="score-label">BUDGET</div><div class="score-value num" id="score-budget" style="font-size:26px;"></div></div>
    <div class="score"><div class="score-label">AUSGEGEBEN</div><div class="score-value num" id="score-spent" style="font-size:26px;"></div></div>
    <div class="score"><div class="score-label">VERFÜGBAR</div><div class="score-value num" id="score-remaining" style="font-size:26px;"></div></div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:28px;align-items:center;">
    <label class="muted" style="white-space:nowrap;">Startbudget</label>
    <input id="budget-input" class="field num" inputmode="numeric" />
    <span class="muted-2">€</span>
  </div>

  <div style="margin-bottom:20px;">
    <div class="muted" style="margin-bottom:8px;">Liste einfügen (Name; Position; Preis)</div>
    <textarea id="paste-text" class="field" rows="4" placeholder="Eine Zeile pro Spieler, z. B.:&#10;Lotka; TW; 8296202&#10;Erlein; AB; 4881989"></textarea>
    <div id="paste-error" class="status-error muted-2 hidden" style="margin-top:6px;"></div>
    <button id="paste-btn" class="btn-primary" style="margin-top:8px;">Liste übernehmen</button>
  </div>

  <div class="add-form">
    <input id="p-name" class="field" placeholder="Spielername" />
    <select id="p-pos" class="field">
      <option value="TW">TW</option>
      <option value="AB">ABW</option>
      <option value="MF" selected>MF</option>
      <option value="ST">ANG</option>
    </select>
    <input id="p-price" class="field num" placeholder="Preis" inputmode="numeric" />
    <button id="add-btn" class="btn-primary">+ Hinzufügen</button>
  </div>

  <div id="player-list"></div>

  <div id="market-section" class="hidden" style="margin-top:32px;">
    <div class="row" style="margin-bottom:10px;">
      <h1 style="font-size:20px;">Transfermarkt</h1>
      <button id="market-refresh-btn" class="btn">Aktualisieren</button>
    </div>
    <div id="market-status" class="status-line">&nbsp;</div>
    <div id="market-list"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBEaEYhet_s8GG7d5LfkBmXL3f9zLbGY4g",
    authDomain: "rueffel.firebaseapp.com",
    databaseURL: "https://rueffel-default-rtdb.firebaseio.com",
    projectId: "rueffel",
    storageBucket: "rueffel.firebasestorage.app",
    messagingSenderId: "23299802061",
    appId: "1:23299802061:web:15b8d7c94da7595980ba84"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const LOCAL_NAME_KEY = "kassenbuch_name";
  const fmt = (n) => new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(Number.isFinite(n) ? n : 0);
  const posLabel = { TW: "TW", AB: "ABW", MF: "MF", ST: "ANG" };
  const sanitizeKey = (name) => name.trim().toLowerCase().replace(/[.#$\[\]\/\s]+/g, "_");

  let state = { budget: 50000000, players: [] };
  let nameKey = null;
  let suppressNextRemoteWrite = false;
  let saveTimer = null;
  let history = [];
  const HISTORY_LIMIT = 30;

  // Kickbase (Beta, inoffiziell)
  const KB_BASE = "https://api.kickbase.com";
  let kb = { token: null, userId: null, leagueId: null };

  const el = (id) => document.getElementById(id);

  function showApp() {
    el("login-screen").classList.add("hidden");
    el("app-screen").classList.remove("hidden");
  }
  function showLogin() {
    el("app-screen").classList.add("hidden");
    el("login-screen").classList.remove("hidden");
  }

  function setStatus(text, isError) {
    const line = el("status-line");
    line.textContent = text || "\u00A0";
    line.className = "status-line" + (isError ? " status-error" : "");
  }

  function render() {
    el("subtitle").textContent = `Kickbase-Kader & Budget im Blick — ${state.players.length} Spieler eingetragen`;
    el("budget-input").value = state.budget;

    const totalSpent = state.players.reduce((s, p) => s + (Number(p.price) || 0), 0);
    const remaining = state.budget - totalSpent;
    const over = remaining < 0;

    el("score-budget").textContent = fmt(state.budget);
    el("score-spent").textContent = fmt(totalSpent);
    const remEl = el("score-remaining");
    remEl.textContent = fmt(remaining);
    remEl.style.color = over ? "var(--danger)" : "var(--accent)";
    [el("score-budget"), el("score-spent"), remEl].forEach((n) => {
      const len = n.textContent.length;
      n.style.fontSize = (len > 12 ? 16 : len > 10 ? 19 : len > 8 ? 22 : 26) + "px";
    });

    const list = el("player-list");
    list.innerHTML = "";
    if (state.players.length === 0) {
      list.innerHTML = `<div class="empty">Noch keine Spieler im Kader. Liste einfügen oder oben manuell eintragen.</div>`;
      return;
    }
    state.players.forEach((p) => {
      const row = document.createElement("div");
      row.className = "player-row";
      row.innerHTML = `
        <div class="avatar">${(p.name.trim().charAt(0) || "?").toUpperCase()}</div>
        <span class="pname">${escapeHtml(p.name)}</span>
        <span class="ppos">${posLabel[p.pos] || p.pos}</span>
        <span class="pprice num">${fmt(p.price)}</span>
        <button class="row-remove" data-id="${p.id}" title="Entfernen">✕</button>
      `;
      row.querySelector(".row-remove").addEventListener("click", () => removePlayer(p.id));
      list.appendChild(row);
    });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function scheduleSave() {
    setStatus("Speichere …", false);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try {
        suppressNextRemoteWrite = true;
        await set(ref(db, `kassenbuch/${nameKey}`), state);
        setStatus("✓ Gespeichert", false);
      } catch (e) {
        setStatus("⚠ Nicht gespeichert — " + (e && e.message ? e.message : "Fehler"), true);
      }
    }, 400);
  }

  function pushHistory() {
    history.push(JSON.stringify({ budget: state.budget, players: state.players }));
    if (history.length > HISTORY_LIMIT) history.shift();
    el("undo-btn").disabled = false;
  }

  function undo() {
    if (history.length === 0) return;
    const prev = JSON.parse(history.pop());
    state = { budget: prev.budget, players: prev.players };
    el("undo-btn").disabled = history.length === 0;
    render();
    scheduleSave();
  }

  function addPlayer() {
    const name = el("p-name").value.trim();
    const price = Number(el("p-price").value.replace(/\./g, "").replace(",", "."));
    const pos = el("p-pos").value;
    if (!name || !Number.isFinite(price) || price <= 0) return;
    pushHistory();
    state.players.push({ id: Date.now(), name, pos, price });
    el("p-name").value = "";
    el("p-price").value = "";
    render();
    scheduleSave();
  }

  function removePlayer(id) {
    pushHistory();
    state.players = state.players.filter((p) => String(p.id) !== String(id));
    render();
    scheduleSave();
  }

  function applyBudget() {
    const v = Number(el("budget-input").value.replace(/\./g, "").replace(",", "."));
    if (Number.isFinite(v) && v >= 0) {
      state.budget = v;
      render();
      scheduleSave();
    }
  }

  function parsePaste() {
    const raw = el("paste-text").value;
    const errBox = el("paste-error");
    errBox.classList.add("hidden");
    const lines = raw.split("\n").map((l) => l.trim()).filter(Boolean);
    if (lines.length === 0) {
      errBox.textContent = "Keine Zeilen erkannt.";
      errBox.classList.remove("hidden");
      return;
    }
    const rows = lines.map((line, i) => {
      const parts = line.split(/[;,]|(?:\s[-–]\s)/).map((p) => p && p.trim()).filter(Boolean);
      let pname = "", pposRaw = "", pprice = "";
      if (parts.length >= 3) { [pname, pposRaw, pprice] = parts; }
      else if (parts.length === 2) { pname = parts[0]; pprice = parts[1]; }
      else { pname = parts[0] || ""; }
      const posGuess = ["TW", "AB", "ABW", "MF", "ST", "ANG"].includes((pposRaw || "").toUpperCase()) ? (pposRaw || "").toUpperCase() : "MF";
      const posNormalized = { ABW: "AB", ANG: "ST" }[posGuess] || posGuess;
      const priceNum = Number(String(pprice).replace(/[€\s.]/g, "").replace(",", "."));
      return {
        id: Date.now() + i,
        name: pname,
        pos: ["TW", "AB", "MF", "ST"].includes(posNormalized) ? posNormalized : "MF",
        price: Number.isFinite(priceNum) ? priceNum : 0,
      };
    }).filter((r) => r.name);
    pushHistory();
    state.players = state.players.concat(rows);
    el("paste-text").value = "";
    render();
    scheduleSave();
  }

  function resetAll() {
    if (!confirm("Wirklich alles zurücksetzen? Kader und Budget werden gelöscht.")) return;
    pushHistory();
    state = { budget: 50000000, players: [] };
    render();
    scheduleSave();
  }

  async function loginWithName(name) {
    if (!name.trim()) return;
    nameKey = sanitizeKey(name);
    localStorage.setItem(LOCAL_NAME_KEY, name.trim());
    showApp();
    setStatus("Lade …", false);
    try {
      const snap = await get(ref(db, `kassenbuch/${nameKey}`));
      if (snap.exists()) {
        const data = snap.val();
        state = {
          budget: typeof data.budget === "number" ? data.budget : 50000000,
          players: Array.isArray(data.players) ? data.players : [],
        };
      } else {
        state = { budget: 50000000, players: [] };
      }
      render();
      setStatus("✓ Gespeichert", false);
    } catch (e) {
      setStatus("⚠ Laden fehlgeschlagen — " + (e && e.message ? e.message : "Fehler"), true);
      render();
    }

    onValue(ref(db, `kassenbuch/${nameKey}`), (snap) => {
      if (suppressNextRemoteWrite) { suppressNextRemoteWrite = false; return; }
      if (!snap.exists()) return;
      const data = snap.val();
      state = {
        budget: typeof data.budget === "number" ? data.budget : state.budget,
        players: Array.isArray(data.players) ? data.players : state.players,
      };
      render();
    });
  }

  // --- Kickbase-Anbindung (Beta, inoffizielle API) ---
  function kbShowError(msg) {
    const box = el("kb-error");
    box.style.whiteSpace = "pre-line";
    box.textContent = msg;
    box.classList.remove("hidden");
  }

  async function kbLogin() {
    const email = el("kb-email").value.trim();
    const pass = el("kb-pass").value;
    if (!email || !pass) return;
    el("kb-error").classList.add("hidden");
    el("kb-login-btn").disabled = true;
    el("kb-login-btn").textContent = "Verbinde …";
    try {
      const res = await fetch(`${KB_BASE}/v4/user/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ em: email, pass: pass, loy: false, rep: {} }),
      });
      if (!res.ok) throw new Error(`Login fehlgeschlagen (HTTP ${res.status})`);
      const data = await res.json();
      kb.token = data.tkn || data.token || (data.u && data.u.tkn);
      kb.userId = (data.u && data.u.id) || data.userId || data.id;
      if (!kb.token) throw new Error("Kein Token in der Antwort gefunden — Kickbase hat evtl. die API geändert.");

      // Ligen laden
      let leagues = data.leagues || data.l;
      if (!leagues) {
        const lr = await fetch(`${KB_BASE}/v4/leagues/selection`, {
          headers: { Authorization: `Bearer ${kb.token}` },
        });
        if (lr.ok) {
          const ld = await lr.json();
          leagues = ld.leagues || ld.it || ld;
        }
      }
      if (!Array.isArray(leagues) || leagues.length === 0) {
        throw new Error("Konnte keine Ligen automatisch finden. Bitte melde dich, dann bau ich ein manuelles Liga-ID-Feld ein.");
      }

      const sel = el("kb-league-select");
      sel.innerHTML = "";
      leagues.forEach((lg) => {
        const opt = document.createElement("option");
        opt.value = lg.id || lg.i || lg.leagueId;
        opt.textContent = lg.name || lg.n || opt.value;
        sel.appendChild(opt);
      });
      el("kb-box").classList.add("hidden");
      el("kb-league-box").classList.remove("hidden");
    } catch (e) {
      kbShowError((e && e.message) || "Unbekannter Fehler beim Login.");
    } finally {
      el("kb-login-btn").disabled = false;
      el("kb-login-btn").textContent = "Verbinden";
    }
  }

  function pickBudget(obj) {
    if (!obj || typeof obj !== "object") return null;
    const candidates = ["budget", "b", "bu", "money", "cash", "tv"];
    for (const key of candidates) {
      if (typeof obj[key] === "number") return obj[key];
    }
    if (obj.user && typeof obj.user === "object") return pickBudget(obj.user);
    if (obj.u && typeof obj.u === "object") return pickBudget(obj.u);
    return null;
  }

  async function kbFetchBudget() {
    const urls = [
      `${KB_BASE}/v4/leagues/${kb.leagueId}/users/${kb.userId}`,
      `${KB_BASE}/v4/leagues/${kb.leagueId}/me`,
      `${KB_BASE}/v4/leagues/${kb.leagueId}/users/${kb.userId}/stats`,
    ];
    for (const url of urls) {
      try {
        const res = await fetch(url, { headers: { Authorization: `Bearer ${kb.token}` } });
        if (!res.ok) continue;
        const data = await res.json();
        const budget = pickBudget(data);
        if (budget != null) return budget;
      } catch (e) {
        // nächste URL versuchen
      }
    }
    return null;
  }

  async function kbLoadSquad() {
    el("kb-error").classList.add("hidden");
    try {
      const sel = el("kb-league-select");
      if (!sel) throw new Error("Interner Fehler: Liga-Auswahl nicht gefunden.");
      kb.leagueId = sel.value;
      if (!kb.leagueId || kb.leagueId === "undefined") {
        throw new Error("Keine gültige Liga-ID gefunden (Wert: " + JSON.stringify(kb.leagueId) + "). Die Kickbase-Antwort für Ligen hat vermutlich ein anderes Format als erwartet.");
      }
      if (!kb.token) throw new Error("Kein Token vorhanden — bitte nochmal einloggen.");
      if (!kb.userId) throw new Error("Keine User-ID vorhanden — Login-Antwort hat vermutlich ein anderes Format als erwartet.");

      el("kb-league-btn").disabled = true;
      el("kb-league-btn").textContent = "Lade Kader …";

      const squadUrl = `${KB_BASE}/v4/leagues/${kb.leagueId}/users/${kb.userId}/players`;
      let res = await fetch(squadUrl, { headers: { Authorization: `Bearer ${kb.token}` } });

      // Fallback: manche Kickbase-Versionen nutzen /squad statt /users/{id}/players
      if (res.status === 404) {
        const fallbackUrl = `${KB_BASE}/v4/leagues/${kb.leagueId}/squad`;
        const res2 = await fetch(fallbackUrl, { headers: { Authorization: `Bearer ${kb.token}` } });
        if (res2.ok) {
          res = res2;
        } else {
          throw new Error(`Kader laden fehlgeschlagen (HTTP ${res.status}).\nVersucht: ${squadUrl}\nFallback (HTTP ${res2.status}): ${fallbackUrl}`);
        }
      } else if (!res.ok) {
        throw new Error(`Kader laden fehlgeschlagen (HTTP ${res.status}).\nVersucht: ${squadUrl}`);
      }
      const data = await res.json();
      const list = data.players || data.it || data;
      if (!Array.isArray(list)) throw new Error("Unerwartetes Antwortformat vom Kader-Endpunkt.");

      const posMap = { 1: "TW", 2: "AB", 3: "MF", 4: "ST" };
      const players = list.map((p, i) => ({
        id: p.id || Date.now() + i,
        name: [p.fn || p.firstName, p.ln || p.lastName || p.n || p.name].filter(Boolean).join(" ") || p.name || "Unbekannt",
        pos: posMap[p.pos || p.position] || "MF",
        price: Number(p.mv || p.marketValue || p.marketValue || 0),
      }));

      let cash = pickBudget(data);
      if (cash == null) {
        cash = await kbFetchBudget();
      }
      const squadValue = players.reduce((s, p) => s + (Number(p.price) || 0), 0);
      const budget = cash != null ? cash + squadValue : null;

      nameKey = "kickbase_" + sanitizeKey(String(kb.userId));
      localStorage.setItem(LOCAL_NAME_KEY, nameKey);
      pushHistory();
      state = { budget: budget != null ? budget : (state.budget || 50000000), players };
      showApp();
      render();
      scheduleSave();
      if (budget == null) {
        setTimeout(() => {
          setStatus("⚠ Guthaben konnte nicht automatisch übernommen werden, bitte Startbudget oben von Hand eintragen (Kaderwert + Restguthaben).", true);
        }, 700);
      }
      el("market-section").classList.remove("hidden");
      kbLoadMarket();
    } catch (e) {
      kbShowError((e && e.message) || "Unbekannter Fehler beim Laden des Kaders.");
    } finally {
      el("kb-league-btn").disabled = false;
      el("kb-league-btn").textContent = "Kader laden";
    }
  }

  function formatExpiry(p) {
    // Kickbase liefert das Ablaufdatum vermutlich entweder als Restsekunden
    // oder als ISO-Datum - wir versuchen beides, mit mehreren Feldnamen.
    let ms = null;
    const secondsField = p.exs ?? p.expirySeconds ?? p.expiry;
    const dateField = p.exd ?? p.expiresAt ?? p.dt ?? p.date;

    if (typeof secondsField === "number" && secondsField > 0) {
      ms = secondsField * 1000;
    } else if (dateField) {
      const d = new Date(dateField);
      if (!isNaN(d.getTime())) ms = d.getTime() - Date.now();
    }
    if (ms == null || ms <= 0) return null;

    const totalMin = Math.floor(ms / 60000);
    const days = Math.floor(totalMin / (60 * 24));
    const hours = Math.floor((totalMin % (60 * 24)) / 60);
    const mins = totalMin % 60;

    if (days > 0) return `noch ${days}T ${hours}Std`;
    if (hours > 0) return `noch ${hours}Std ${mins}Min`;
    return `noch ${mins}Min`;
  }

  async function kbLoadMarket() {
    if (!kb.token || !kb.leagueId) return;
    const statusEl = el("market-status");
    statusEl.textContent = "Lade Transfermarkt …";
    statusEl.className = "status-line";
    try {
      const res = await fetch(`${KB_BASE}/v4/leagues/${kb.leagueId}/market`, {
        headers: { Authorization: `Bearer ${kb.token}` },
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const list = data.players || data.it || data.market || [];
      const posMap = { 1: "TW", 2: "AB", 3: "MF", 4: "ST" };
      const marketList = el("market-list");
      marketList.innerHTML = "";
      if (!Array.isArray(list) || list.length === 0) {
        marketList.innerHTML = `<div class="empty">Transfermarkt ist aktuell leer oder geschlossen.</div>`;
      } else {
        list.forEach((p) => {
          const name = [p.fn || p.firstName, p.ln || p.lastName || p.n].filter(Boolean).join(" ") || "Unbekannt";
          const pos = posMap[p.pos || p.position] || "MF";
          const price = Number(p.prc || p.price || p.mv || p.marketValue || 0);
          const expiryText = formatExpiry(p);
          const row = document.createElement("div");
          row.className = "market-row";
          row.innerHTML = `
            <div class="avatar">${(name.charAt(0) || "?").toUpperCase()}</div>
            <span class="pname">${escapeHtml(name)}</span>
            <span class="ppos">${pos}</span>
            <div>
              <span class="pprice num">${fmt(price)}</span>
              ${expiryText ? `<span class="market-expiry">${expiryText}</span>` : `<span class="market-expiry">Ablauf unbekannt</span>`}
            </div>
          `;
          marketList.appendChild(row);
        });
      }
      statusEl.textContent = "\u00A0";
    } catch (e) {
      statusEl.textContent = "⚠ Transfermarkt nicht ladbar — " + ((e && e.message) || "Fehler");
      statusEl.className = "status-line status-error";
    }
  }

  function logout() {
    localStorage.removeItem(LOCAL_NAME_KEY);
    nameKey = null;
    kb = { token: null, userId: null, leagueId: null };
    history = [];
    el("undo-btn").disabled = true;
    el("market-section").classList.add("hidden");
    state = { budget: 50000000, players: [] };
    el("login-name").value = "";
    showLogin();
  }

  el("login-btn").addEventListener("click", () => loginWithName(el("login-name").value));
  el("login-name").addEventListener("keydown", (e) => { if (e.key === "Enter") loginWithName(el("login-name").value); });
  el("logout-btn").addEventListener("click", logout);
  el("reset-btn").addEventListener("click", resetAll);
  el("add-btn").addEventListener("click", addPlayer);
  el("p-name").addEventListener("keydown", (e) => { if (e.key === "Enter") addPlayer(); });
  el("p-price").addEventListener("keydown", (e) => { if (e.key === "Enter") addPlayer(); });
  el("budget-input").addEventListener("blur", applyBudget);
  el("budget-input").addEventListener("keydown", (e) => { if (e.key === "Enter") applyBudget(); });
  el("paste-btn").addEventListener("click", parsePaste);
  el("undo-btn").addEventListener("click", undo);

  el("kb-toggle").addEventListener("click", () => {
    el("kb-box").classList.toggle("hidden");
  });
  el("kb-login-btn").addEventListener("click", kbLogin);
  el("kb-pass").addEventListener("keydown", (e) => { if (e.key === "Enter") kbLogin(); });
  el("kb-league-btn").addEventListener("click", kbLoadSquad);
  el("market-refresh-btn").addEventListener("click", kbLoadMarket);

  const savedName = localStorage.getItem(LOCAL_NAME_KEY);
  if (savedName) {
    el("login-name").value = savedName;
    loginWithName(savedName);
  } else {
    showLogin();
  }
</script>

</body>
</html>
